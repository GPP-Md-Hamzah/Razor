<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>موقع محمي</title>
<style>
:root{--bg:#F3F6F7;--card:#fff;--ink:#0F1E26;--muted:#56676F;--line:#D7E0E3;--accent:#087F96;--err:#C21E6B}
@media (prefers-color-scheme:dark){:root{--bg:#0B1418;--card:#111E24;--ink:#E4EDF0;--muted:#8FA3AB;--line:#21343C;--accent:#34C4DE;--err:#F06BA8;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;padding:16px}
.box{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px}
.strip{display:flex;height:4px;border-radius:2px;overflow:hidden}.strip i{flex:1}
.strip i:nth-child(1){background:#00A3D3}.strip i:nth-child(2){background:#D3237A}.strip i:nth-child(3){background:#EDBE00}.strip i:nth-child(4){background:#1B2328}
h1{font-size:20px;margin:0}p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;font-size:16px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--accent)}
button{font:600 15px inherit;font-family:inherit;padding:12px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
label.rm{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.err{color:var(--err);font-size:13px;min-height:1em}
</style></head><body>
<form class="box" id="f">
<div class="strip"><i></i><i></i><i></i><i></i></div>
<h1>الموقع محمي بكلمة مرور</h1>
<p>أدخل كلمة المرور لعرض الموقع.</p>
<input type="password" id="p" autocomplete="current-password" placeholder="كلمة المرور" required autofocus>
<label class="rm"><input type="checkbox" id="r"> تذكّرني على هذا الجهاز</label>
<button id="b" type="submit">فتح</button>
<div class="err" id="e" role="alert"></div>
</form>

const d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:d(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:d(P.i)}, key, d(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const K = "site-key";
(async()=>{ let s=null; try{s=localStorage.getItem(K)}catch(_){}
  if(s){ try{ show(await open_(s)); }catch(_){ try{localStorage.removeItem(K)}catch(_){} } } })();
document.getElementById("f").addEventListener("submit", async e=>{
  e.preventDefault(); const b=document.getElementById("b"), er=document.getElementById("e"), pw=document.getElementById("p").value;
  b.disabled=true; b.textContent="جارٍ الفتح…"; er.textContent="";
